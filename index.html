<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="A private, offline-first personal fitness tracker.">
<link rel="manifest" href="manifest.json">
<title>FitTrack — Personal Fitness Coach</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--ink:#f9fafb;--muted:#9ca3af;--line:#374151;--accent:#6ee7b7;--accent-soft:#263b3b;--green:#6ee7b7;--red:#fca5a5;--shadow:0 8px 24px #0002}
[data-theme="light"]{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--ink:#182230;--muted:#697586;--line:#e3e8ef;--accent:#0d9488;--accent-soft:#e0f2f1;--green:#14805e;--red:#c44545;--shadow:0 5px 22px #17243a0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:980px;margin:0 auto;min-height:100dvh;padding-bottom:100px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#263b3b;color:#6ee7b7;font-size:22px}.brand h1{font-size:19px;line-height:1.1;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px}
main{padding:0 14px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 4px 14px}.pagehead h2{margin:0;font-size:24px;letter-spacing:-.5px}.datecontrol{display:flex;gap:7px;align-items:center}.datecontrol input{max-width:150px}.field,input,select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0;width:100%}.field-label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:0 0 5px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .value{font-size:25px;font-weight:750;letter-spacing:-.6px;margin-top:5px;overflow-wrap:anywhere}.stat .sub{font-size:12px;color:var(--muted);margin-top:3px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 3px 10px}.section-title h3{margin:0;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:11px}.progress>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}.btn{border:0;background:var(--accent);color:white;padding:11px 14px;border-radius:11px;font-weight:700}.btn.secondary{background:var(--accent-soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#a72e2e}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:0 0 auto}.meal-list,.record-list{display:grid;gap:9px}.meal,.record{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.meal-icon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}.meal-main{flex:1;min-width:0}.meal-main strong,.record strong{display:block;overflow-wrap:anywhere}.meal-main .meta{font-size:12px;color:var(--muted);margin-top:3px}.meal-cal{font-weight:750;white-space:nowrap}.textbtn{border:0;background:none;color:var(--accent);padding:7px;font-weight:700}.empty{padding:24px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.hidden{display:none!important}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}.comparegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.compare{border:1px solid var(--line);border-radius:13px;padding:12px}.compare .name{font-size:12px;color:var(--muted)}.compare .diff{font-size:19px;font-weight:750;margin-top:4px}.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}.chart-wrap{height:230px;width:100%;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-label{font-size:10px;fill:var(--muted)}.chart-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.week-nav button{padding:8px 12px}.bottomnav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:3px;backdrop-filter:blur(18px)}.bottomnav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:650;min-width:0}.bottomnav button .navicon{font-size:20px;line-height:1.1}.bottomnav button.active{background:var(--accent-soft);color:var(--accent)}.notice{padding:11px 13px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:12px;margin-top:12px}.footnote{color:var(--muted);font-size:11px;margin:18px 4px}.toast{position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:90%;text-align:center}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(600px,100%);max-height:92dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:18px}.modal h3{margin:0 0 15px;font-size:20px}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.modal-top h3{margin:0}.inline-note{font-size:12px;color:var(--muted);margin-top:5px}

.dashboard-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 4px 18px}.dashboard-hero h2{font-size:29px;letter-spacing:-1px;margin:5px 0 2px}.dashboard-hero p{margin:0;color:var(--muted);font-size:13px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--accent)}.dashboard-hero .datecontrol input{max-width:145px;font-size:12px;padding:9px}.calorie-hero{background:linear-gradient(135deg,#1f3438,#1f2937 70%);border:1px solid #34504d;border-radius:22px;padding:20px;margin-bottom:13px;box-shadow:var(--shadow)}.calorie-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.calorie-number{font-size:34px;font-weight:850;letter-spacing:-1.2px;margin-top:5px}.calorie-number span{font-size:13px;color:#a7b7bc;font-weight:600;letter-spacing:0}.flame-icon{width:44px;height:44px;border-radius:15px;background:#344b43;color:#6ee7b7;display:grid;place-items:center;font-size:26px}.hero-track{height:9px;border-radius:99px;background:#3b4b4d;overflow:hidden;margin-top:19px}.hero-track>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#6ee7b7)}.hero-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:#a7b7bc}.hero-foot strong{color:#6ee7b7}.dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0;box-shadow:var(--shadow)}.metric-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;font-size:20px;font-weight:800;margin-bottom:12px}.protein-icon{background:#453a25;color:#fbbf24}.weight-icon{background:#263a52;color:#93c5fd}.steps-icon{background:#3b3154;color:#c4b5fd}.burn-icon{background:#4a3034;color:#fca5a5}.metric-value{font-size:27px;font-weight:800;letter-spacing:-.7px;margin:3px 0 5px;overflow-wrap:anywhere}.metric-value span{font-size:13px;color:var(--muted);font-weight:600}.macro-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.macro-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}.macro-head{display:flex;flex-direction:column;gap:3px}.macro-head span{font-size:12px;color:var(--muted)}.macro-head strong{font-size:20px}.dashboard-meals .meal-list{gap:8px}.dashboard-meals .meal{border-radius:15px}.dashboard-chart{padding:12px}.privacy-note{font-size:11px;color:var(--muted);text-align:center;margin:20px 4px 4px}.dashboard-meals .empty{padding:25px 14px}.dashboard-meals .empty p{margin:5px 0 14px}.dashboard-hero .datecontrol{max-width:150px}
@media(min-width:650px){.dashboard-metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.dashboard-hero h2{font-size:34px}.calorie-hero{padding:24px}.macro-grid{gap:12px}main{padding:0 22px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.comparegrid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal-backdrop{align-items:center}.topbar{padding-left:26px;padding-right:26px}.app{padding-bottom:100px}.bottomnav{left:50%;right:auto;transform:translateX(-50%);width:min(620px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
@media(max-width:380px){.dashboard-hero{align-items:flex-start;flex-direction:column}.dashboard-hero .datecontrol{max-width:100%;width:100%}.dashboard-hero .datecontrol input{max-width:none}.calorie-number{font-size:30px}.metric-card{padding:11px}.macro-card{padding:9px}.macro-head strong{font-size:17px}.stat .value{font-size:21px}.pagehead h2{font-size:21px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.datecontrol input{max-width:130px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand"><div class="logo">✓</div><div><h1>FitTrack</h1><p>Your personal fitness log</p></div></div>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
</header>
<main id="main"></main>
<nav class="bottomnav" aria-label="Main navigation">
  <button data-tab="today" class="active"><span class="navicon">⌂</span>Home</button>
  <button data-tab="meals"><span class="navicon">＋</span>Food</button>
  <button data-tab="weight"><span class="navicon">⚖</span>Weight</button>
  <button data-tab="weekly"><span class="navicon">▥</span>Progress</button>
  <button data-tab="coach"><span class="navicon">✦</span>Coach</button>
  <button data-tab="settings"><span class="navicon">⚙</span>Settings</button>
</nav>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(() => {
'use strict';
const KEY='fittrack-data-v1', THEME='fittrack-theme-v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateObj=s=>new Date(s+'T12:00:00');
const fmtDate=(s,opts={month:'short',day:'numeric'})=>s?dateObj(s).toLocaleDateString(undefined,opts):'—';
const num=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0}):'0';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
const defaultData=()=>({settings:{goal:1900,startWeight:null},meals:[],weights:[],activities:[]});
let data=loadData(), currentTab='today', selectedDate=todayISO(), weekOffset=0, editingMealId=null, coachDraft=null;
function loadData(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.meals)&&Array.isArray(x.weights)&&Array.isArray(x.activities))return {...defaultData(),...x,settings:{...defaultData().settings,...x.settings}}}catch(e){}return defaultData()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',2400)}
function mealsOn(date){return data.meals.filter(x=>x.date===date)}
function weightOn(date){return data.weights.find(x=>x.date===date)}
const STEP_KCAL_PER_STEP=0.04; // rough average estimate; actual burn varies by body size, pace and terrain
function activityOn(date){const a=data.activities.find(x=>x.date===date);if(!a)return {date,workouts:[],steps:'',notes:''};if(!Array.isArray(a.workouts)){const oldBurn=Number(a.burned||0);a.workouts=oldBurn>0?[{id:uid(),name:a.notes?.trim()||'Previously logged activity',kcal:oldBurn}]:[];}return a}
function workoutBurn(a){return (a.workouts||[]).reduce((sum,w)=>sum+Math.max(0,Number(w.kcal||0)),0)}
function stepsBurn(a){return Math.round(Math.max(0,Number(a.steps||0))*STEP_KCAL_PER_STEP)}
function totalActivityBurn(a){return workoutBurn(a)+stepsBurn(a)}
function sumMeals(date){return mealsOn(date).reduce((a,m)=>a+Number(m.calories||0),0)}
function sumMacro(date,k){return mealsOn(date).reduce((a,m)=>a+Number(m[k]||0),0)}
function dayRange(date){const d=dateObj(date);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`})}
function diffLabel(delta){if(delta===null||!Number.isFinite(delta))return {text:'No data',cls:'flat'};if(Math.abs(delta)<0.005)return {text:'0.00 kg',cls:'flat'};return {text:`${delta>0?'+':''}${delta.toFixed(2)} kg`,cls:delta>0?'up':'down'}}
function compareWeight(date,offsetDays){const cur=weightOn(date);if(!cur)return null;const target=new Date(dateObj(date));target.setDate(target.getDate()-offsetDays);const key=`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;const prev=weightOn(key);return prev?Number(cur.kg)-Number(prev.kg):null}
function startWeight(){if(data.settings.startWeight!==null&&data.settings.startWeight!==''&&Number.isFinite(Number(data.settings.startWeight)))return Number(data.settings.startWeight);const first=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date))[0];return first?Number(first.kg):null}
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function section(title,right=''){return `<div class="section-title"><h3>${title}</h3>${right}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function mealRows(date){const ms=mealsOn(date).slice().sort((a,b)=>a.created-b.created);if(!ms.length)return empty('No meals logged for this day yet.');return `<div class="meal-list">${ms.map(m=>`<div class="meal"><div class="meal-icon">${({Breakfast:'☀️',Lunch:'🥗',Dinner:'🍽️',Snack:'🍎'}[m.type]||'🍴')}</div><div class="meal-main"><strong>${esc(m.name)}</strong><div class="meta">${esc(m.type)} · P ${num(m.protein)}g · C ${num(m.carbs)}g · F ${num(m.fat)}g</div></div><div class="meal-cal">${num(m.calories)}<div class="small muted">kcal</div></div><button class="textbtn" data-edit-meal="${m.id}" aria-label="Edit ${esc(m.name)}">Edit</button><button class="textbtn" data-delete-meal="${m.id}" aria-label="Delete ${esc(m.name)}">×</button></div>`).join('')}</div>`}
function renderToday(){const eaten=sumMeals(selectedDate),act=activityOn(selectedDate),burn=totalActivityBurn(act),goal=Number(data.settings.goal||1900),w=weightOn(selectedDate),protein=sumMacro(selectedDate,'protein'),carbs=sumMacro(selectedDate,'carbs'),fat=sumMacro(selectedDate,'fat'),steps=Number(act.steps||0),pct=goal>0?Math.min(100,Math.round(eaten/goal*100)):0,proteinGoal=Number(data.settings.proteinGoal||130),stepGoal=Number(data.settings.stepGoal||10000),weightDiff=compareWeight(selectedDate,7),recent=dayRange(selectedDate);
const macroCard=(label,value,target,color)=>`<div class="macro-card"><div class="macro-head"><span>${label}</span><strong>${num(value)} g</strong></div><div class="progress"><div style="width:${target>0?Math.min(100,value/target*100):0}%;background:${color}"></div></div><div class="small muted">${target?`${num(target)} g goal`:'Logged total'}</div></div>`;
return `<div class="dashboard-hero"><div><div class="eyebrow">FITTRACK · DAILY OVERVIEW</div><h2>Today, let's go.</h2><p>${fmtDate(selectedDate,{weekday:'long',month:'long',day:'numeric'})}</p></div><div class="datecontrol"><input id="selectedDate" type="date" value="${selectedDate}" aria-label="Selected date"></div></div>
<div class="calorie-hero"><div class="calorie-top"><div><div class="muted small">CALORIES CONSUMED</div><div class="calorie-number">${num(eaten)} <span>/ ${num(goal)} kcal</span></div></div><div class="flame-icon">ϟ</div></div><div class="hero-track"><div style="width:${pct}%"></div></div><div class="hero-foot"><span>${pct}% of daily goal</span><strong>${num(Math.max(0,goal-eaten))} kcal remaining</strong></div></div>
<div class="grid dashboard-metrics"><div class="metric-card"><div class="metric-icon protein-icon">◉</div><div class="muted small">Protein</div><div class="metric-value">${num(protein)}<span> g</span></div><div class="progress"><div style="width:${Math.min(100,protein/proteinGoal*100)}%;background:#fbbf24"></div></div><div class="small muted">of ${num(proteinGoal)} g goal</div></div><div class="metric-card"><div class="metric-icon weight-icon">↗</div><div class="muted small">Body weight</div><div class="metric-value">${w?num(w.kg,2):'—'}<span>${w?' kg':''}</span></div><div class="small ${weightDiff===null?'muted':diffLabel(weightDiff).cls}">${w?`7-day change ${diffLabel(weightDiff).text}`:'Log a weigh-in'}</div><button class="textbtn" data-action="edit-weight">${w?'Update weight':'＋ Log weight'}</button></div><div class="metric-card"><div class="metric-icon steps-icon">⌁</div><div class="muted small">Steps</div><div class="metric-value">${steps?num(steps):'—'}</div><div class="progress"><div style="width:${Math.min(100,steps/stepGoal*100)}%;background:#c4b5fd"></div></div><div class="small muted">${steps?`${num(Math.max(0,stepGoal-steps))} to goal`:'Log steps in activity'}</div></div><div class="metric-card"><div class="metric-icon burn-icon">ϟ</div><div class="muted small">Activity burned</div><div class="metric-value">${num(burn)}<span> kcal</span></div><div class="small muted">Steps ${num(stepsBurn(act))} + workouts ${num(workoutBurn(act))} kcal</div><button class="textbtn" data-action="edit-activity">＋ Manage activity</button></div></div>
<div class="section-title"><h3>Macros</h3><span class="small muted">Today's logged totals</span></div><div class="grid macro-grid">${macroCard('Protein',protein,proteinGoal,'#fbbf24')}${macroCard('Carbs',carbs,0,'#60a5fa')}${macroCard('Fat',fat,0,'#f472b6')}</div>
<div class="section-title"><h3>Today's meals</h3><button class="btn secondary" data-action="add-meal">＋ Add food</button></div><div class="dashboard-meals">${mealsOn(selectedDate).length?mealRows(selectedDate):`<div class="empty"><div style="font-size:28px;margin-bottom:8px">＋</div><strong>No meals logged yet</strong><p class="small">Add your first meal to see calories and macros here.</p><button class="btn" data-action="add-meal">Add a meal</button></div>`}</div>
<div class="section-title"><h3>Weight trend</h3><button class="textbtn" data-tab="weekly">View progress →</button></div><div class="card dashboard-chart">${svgChart(recent)}<div class="inline-note">Use consistent weigh-in conditions and focus on the trend rather than one day's change.</div></div><div class="privacy-note">Your entries stay in this browser on this device. Workout calories are manually entered; step calories are rough estimates (~0.04 kcal per step).</div>`}
function renderCoach(){
 const draft=coachDraft;
 return `<div class="pagehead"><div><h2>Daily Coach</h2><div class="small muted">Describe your day in plain language</div></div><span class="pill">Free · On-device</span></div>
 <div class="card"><div class="section-title" style="margin-top:0"><h3>Your daily log</h3><input id="coachDate" type="date" value="${selectedDate}" style="max-width:155px" aria-label="Coach date"></div>
 <label class="field-label" for="coachInput">Meals, steps, workouts and weight</label>
 <textarea id="coachInput" rows="9" placeholder="Breakfast: 3 whole eggs, 90 g Bonn brown bread\nLunch: 120 g white rice, 200 g Malka dal, 50 g paneer\nDinner: 160 g chicken breast, 2 roti\nSteps: 10000\nWorkout: chest and triceps 150 kcal; treadmill 100 kcal\nWeight: 79.5 kg">${esc(draft?.raw||'')}</textarea>
 <div class="inline-note">Use one meal per line. Include quantities for each food. Steps, workout calories and weight are optional. This local coach uses your approved food database; it does not send your data to an AI service.</div>
 <div class="btnrow" style="margin-top:13px"><button class="btn" data-action="parse-coach">Review my day</button><button class="btn ghost" data-action="coach-example">Load example</button></div></div>
 ${draft?renderCoachPreview(draft):`<div class="section-title"><h3>What you'll get</h3></div><div class="grid stats">${stat('Nutrition','Calories + macros','From matched foods')}${stat('Activity','Steps + workouts','Estimated step kcal + manual workout kcal')}${stat('Weight','Daily comparison','Against your logged history')}${stat('Insights','Actionable notes','Goal checks and trend context')}</div><div class="notice">Nothing is saved until you review the parsed foods and press “Confirm & save day”. Unmatched foods are flagged instead of guessed.</div>`}`
}
function renderCoachPreview(d){

  ingredients.push({foodIndex:idx,name:f.name,grams:amount,unit:f.basis.toLowerCase().includes("ml")?"ml":"g",
    basis:f.basis,status:f.status,notes:f.notes,
    calories:f.kcal==null?null:f.kcal*factor,
    protein:f.p==null?null:f.p*factor,carbs:f.c==null?null:f.c*factor,
    fat:f.f==null?null:f.f*factor,fiber:f.fiber==null?null:f.fiber*factor});
  if(!root.querySelector('#mealName').value)root.querySelector('#mealName').value=f.name;
  renderIngredients();
 };
 root.querySelector('#ingredientList').addEventListener('click',e=>{
  const b=e.target.closest('[data-remove-ingredient]');
  if(b){ingredients.splice(Number(b.dataset.removeIngredient),1);renderIngredients()}
 });
 root.querySelector('#cancelMeal').onclick=()=>root.innerHTML='';
 if(ingredients.length)renderIngredients();
 else if(m){ /* Existing legacy entries remain editable without forcing ingredient conversion. */ }
}
function activityForm(){const a=activityOn(selectedDate);let workoutIndex=0;const row=(w={},i=workoutIndex++)=>`<div class="card workout-entry" data-workout-row style="padding:12px;margin-top:8px;box-shadow:none"><div class="formgrid"><div><label class="field-label">Workout name</label><input name="workoutName_${i}" maxlength="80" placeholder="e.g. Chest & triceps" value="${esc(w.name||'')}"></div><div><label class="field-label">Calories burned (kcal)</label><input name="workoutKcal_${i}" type="number" min="0" max="50000" step="1" value="${esc(w.kcal??'')}"></div></div><div style="text-align:right;margin-top:5px"><button class="textbtn" type="button" data-remove-workout>Remove workout</button></div></div>`;const workouts=(a.workouts||[]).map(w=>row(w)).join('');openModal('Daily activity',`<form id="activityForm"><div class="card" style="box-shadow:none"><div class="section-title" style="margin-top:0"><h3>Daily steps</h3></div><label class="field-label">Steps counted today</label><input name="steps" type="number" min="0" max="200000" step="1" value="${esc(a.steps||'')}" placeholder="e.g. 10000"><div class="inline-note">Estimated walking calories: about ${STEP_KCAL_PER_STEP.toFixed(2)} kcal per step. This is a rough average, not an exact measurement.</div></div><div class="section-title"><h3>Workouts</h3><button class="btn secondary" type="button" id="addWorkout">＋ Add workout</button></div><div id="workoutRows">${workouts||'<div class="empty" id="noWorkouts">No workouts added yet. Add each workout separately.</div>'}</div><div class="card" style="margin-top:12px;box-shadow:none"><div class="small muted">Estimated steps calories</div><strong id="stepsBurnPreview">${num(stepsBurn(a))} kcal</strong><div class="small muted" style="margin-top:8px">Workout calories</div><strong id="workoutBurnPreview">${num(workoutBurn(a))} kcal</strong><div class="small muted" style="margin-top:8px">Total activity calories</div><div class="metric-value" id="totalBurnPreview">${num(totalActivityBurn(a))}<span> kcal</span></div></div><div class="actions"><button class="btn ghost" type="button" id="cancelActivity">Cancel</button><button class="btn">Save activity</button></div></form>`,v=>{const root=document.getElementById('modalRoot');const form=root.querySelector('#activityForm');const fd=new FormData(form);const workouts=[];for(const [key,value] of fd.entries()){const match=key.match(/^workoutName_(\d+)$/);if(!match)continue;const i=match[1],name=String(value).trim(),kcalValue=fd.get(`workoutKcal_${i}`);const kcal=Number(kcalValue||0);if(name||kcal>0){if(!name){toast('Add a name for each workout.');return false}if(!Number.isFinite(kcal)||kcal<0||kcal>50000){toast('Enter valid workout calories.');return false}workouts.push({id:uid(),name,kcal})}}const stepsValue=fd.get('steps');const steps=stepsValue===''?'':Number(stepsValue);if(steps!==''&&(!Number.isFinite(steps)||steps<0||steps>200000)){toast('Enter valid steps.');return false}data.activities=data.activities.filter(x=>x.date!==selectedDate);data.activities.push({date:selectedDate,workouts,steps,notes:''});save();toast('Activity saved')});const root=document.getElementById('modalRoot');const refreshPreview=()=>{const form=root.querySelector('#activityForm');if(!form)return;const steps=Math.max(0,Number(form.elements.steps.value||0));let workout=0;root.querySelectorAll('[data-workout-row]').forEach(r=>{const input=r.querySelector('input[name^="workoutKcal_"]');workout+=Math.max(0,Number(input?.value||0))});root.querySelector('#stepsBurnPreview').textContent=`${num(Math.round(steps*STEP_KCAL_PER_STEP))} kcal`;root.querySelector('#workoutBurnPreview').textContent=`${num(workout)} kcal`;root.querySelector('#totalBurnPreview').innerHTML=`${num(Math.round(steps*STEP_KCAL_PER_STEP)+workout)}<span> kcal</span>`};root.querySelector('#addWorkout').onclick=()=>{root.querySelector('#noWorkouts')?.remove();const host=root.querySelector('#workoutRows');host.insertAdjacentHTML('beforeend',row({}));refreshPreview()};root.querySelector('#workoutRows').addEventListener('click',e=>{const b=e.target.closest('[data-remove-workout]');if(b){b.closest('[data-workout-row]').remove();if(!root.querySelector('[data-workout-row]'))root.querySelector('#workoutRows').innerHTML='<div class="empty" id="noWorkouts">No workouts added yet. Add each workout separately.</div>';refreshPreview()}});root.querySelector('#activityForm').addEventListener('input',refreshPreview);root.querySelector('#cancelActivity').onclick=()=>root.innerHTML=''}
function saveWeight(){const input=document.getElementById('weightValue');if(!input)return;const v=input.value;if(v===''||!Number.isFinite(Number(v))||Number(v)<20||Number(v)>500){toast('Enter a valid weight in kg.');return}data.weights=data.weights.filter(x=>x.date!==selectedDate);data.weights.push({date:selectedDate,kg:Number(Number(v).toFixed(2))});data.weights.sort((a,b)=>a.date.localeCompare(b.date));if(data.settings.startWeight===null||data.settings.startWeight==='')data.settings.startWeight=Number(Number(v).toFixed(2));save();toast('Weight saved');render()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(`fittrack-backup-${todayISO()}.json`,JSON.stringify({...data,exportedAt:new Date().toISOString(),formatVersion:1},null,2),'application/json');toast('JSON backup exported')}
function csvCell(v){const s=String(v??'');return `"${s.replace(/"/g,'""')}"`}
function exportCSV(){const rows=[['date','record_type','name','meal_type','calories_kcal','protein_g','carbs_g','fat_g','weight_kg','calories_burned_kcal','steps','notes']];data.meals.forEach(m=>rows.push([m.date,'meal',m.name,m.type,m.calories,m.protein,m.carbs,m.fat,'','','','']));data.weights.forEach(w=>rows.push([w.date,'weight','','','','','','',w.kg,'','','']));data.activities.forEach(a=>{rows.push([a.date,'activity summary','','','','','','','',totalActivityBurn(a),a.steps,`Steps estimate: ${stepsBurn(a)} kcal`]);(a.workouts||[]).forEach(w=>rows.push([a.date,'workout',w.name,'','','','','','',''+w.kcal,a.steps,'']));});download(`fittrack-export-${todayISO()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported')}
function importBackup(){openModal('Import JSON backup',`<form><div class="notice">Import replaces the records currently stored in this browser. Export a backup first if you want to keep them.</div><label class="field-label" style="margin-top:14px">Choose a FitTrack JSON backup</label><input name="file" type="file" accept="application/json,.json" required><div class="actions"><button class="btn ghost" type="button" id="cancelImport">Cancel</button><button class="btn">Import backup</button></div></form>`,async v=>{const file=v.file;if(!file||typeof file==='string')return false;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.meals)||!Array.isArray(parsed.weights)||!Array.isArray(parsed.activities))throw Error('invalid');data={...defaultData(),...parsed,settings:{...defaultData().settings,...parsed.settings}};save();selectedDate=todayISO();toast('Backup imported')}catch(e){toast('Could not read this FitTrack backup.');return false}});document.getElementById('cancelImport').onclick=()=>document.getElementById('modalRoot').innerHTML=''}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){currentTab=b.dataset.tab;render();return}if(b.dataset.action){const a=b.dataset.action;if(a==='add-meal')mealForm();if(a==='edit-activity')activityForm();if(a==='parse-coach'){const raw=document.getElementById('coachInput')?.value||'',date=document.getElementById('coachDate')?.value||selectedDate;if(!raw.trim()){toast('Enter your day first.');return}selectedDate=date;coachDraft=parseCoachText(raw,date);render()}if(a==='coach-example'){coachDraft=null;render();const t=document.getElementById('coachInput');if(t)t.value='Breakfast: 3 whole eggs, 90 g Bonn brown bread\nLunch: 120 g white rice, 200 g Malka dal, 50 g paneer\nDinner: 160 g chicken breast, 2 roti\nSteps: 10000\nWorkouts: Chest and triceps 150 kcal; treadmill 100 kcal\nWeight: 79.5 kg'}if(a==='edit-coach'){coachDraft=null;render()}if(a==='clear-coach'){coachDraft=null;render()}if(a==='save-coach'){saveCoachDraft()}if(a==='edit-weight'){currentTab='weight';render()}if(a==='save-weight')saveWeight();if(a==='delete-weight'){if(confirm(`Delete weight for ${selectedDate}?`)){data.weights=data.weights.filter(x=>x.date!==selectedDate);save();render();toast('Weight deleted')}}if(a==='save-settings'){const g=Number(document.getElementById('goalInput').value),s=document.getElementById('startWeightInput').value;if(!Number.isFinite(g)||g<0||g>10000){toast('Enter a valid calorie goal.');return}if(s!==''&&(!Number.isFinite(Number(s))||Number(s)<20||Number(s)>500)){toast('Enter a valid starting weight.');return}const pg=Number(document.getElementById('proteinGoalInput')?.value??data.settings.proteinGoal??130),sg=Number(document.getElementById('stepGoalInput')?.value??data.settings.stepGoal??10000);if(!Number.isFinite(pg)||pg<0||pg>500||!Number.isFinite(sg)||sg<0||sg>100000){toast('Enter valid protein and step goals.');return}data.settings.goal=g;data.settings.proteinGoal=pg;data.settings.stepGoal=sg;data.settings.startWeight=s===''?null:Number(s);save();render();toast('Settings saved')}if(a==='export-json')exportJSON();if(a==='export-csv')exportCSV();if(a==='import')importBackup();if(a==='prev-week'){weekOffset--;render()}if(a==='next-week'){weekOffset=Math.min(0,weekOffset+1);render()}return}
if(b.dataset.coachRemove&&coachDraft){const [mi,xi]=b.dataset.coachRemove.split(':').map(Number);if(coachDraft.meals[mi])coachDraft.meals[mi].items.splice(xi,1);render();return}if(b.dataset.editMeal)mealForm(b.dataset.editMeal);
if(b.dataset.deleteMeal){const m=data.meals.find(x=>x.id===b.dataset.deleteMeal);if(m&&confirm(`Delete "${m.name}"?`)){data.meals=data.meals.filter(x=>x.id!==m.id);save();render();toast('Meal deleted')}}
if(b.dataset.openDate){selectedDate=b.dataset.openDate;currentTab='today';render()}
});
document.addEventListener('change',e=>{if(e.target.id==='coachDate'){if(e.target.value){selectedDate=e.target.value;if(coachDraft)coachDraft.date=e.target.value}return}if(e.target.id==='selectedDate'||e.target.id==='mealDate'||e.target.id==='weightDate'){if(e.target.value){selectedDate=e.target.value;render()}}});
document.getElementById('themeBtn').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(THEME,next);document.getElementById('themeBtn').textContent=next==='dark'?'☀':'☾'});
const savedTheme=localStorage.getItem(THEME);if(savedTheme)document.documentElement.dataset.theme=savedTheme;document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
