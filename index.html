<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="A private, offline-first personal fitness tracker.">
<link rel="manifest" href="manifest.json">
<title>FitTrack — Personal Fitness</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--ink:#f9fafb;--muted:#9ca3af;--line:#374151;--accent:#6ee7b7;--accent-soft:#263b3b;--green:#6ee7b7;--red:#fca5a5;--shadow:0 8px 24px #0002}
[data-theme="light"]{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--ink:#182230;--muted:#697586;--line:#e3e8ef;--accent:#0d9488;--accent-soft:#e0f2f1;--green:#14805e;--red:#c44545;--shadow:0 5px 22px #17243a0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:980px;margin:0 auto;min-height:100dvh;padding-bottom:100px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#263b3b;color:#6ee7b7;font-size:22px}.brand h1{font-size:19px;line-height:1.1;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px}
main{padding:0 14px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 4px 14px}.pagehead h2{margin:0;font-size:24px;letter-spacing:-.5px}.datecontrol{display:flex;gap:7px;align-items:center}.datecontrol input{max-width:150px}.field,input,select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0;width:100%}.field-label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:0 0 5px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .value{font-size:25px;font-weight:750;letter-spacing:-.6px;margin-top:5px;overflow-wrap:anywhere}.stat .sub{font-size:12px;color:var(--muted);margin-top:3px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 3px 10px}.section-title h3{margin:0;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:11px}.progress>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}.btn{border:0;background:var(--accent);color:white;padding:11px 14px;border-radius:11px;font-weight:700}.btn.secondary{background:var(--accent-soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#a72e2e}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:0 0 auto}.meal-list,.record-list{display:grid;gap:9px}.meal,.record{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.meal-icon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}.meal-main{flex:1;min-width:0}.meal-main strong,.record strong{display:block;overflow-wrap:anywhere}.meal-main .meta{font-size:12px;color:var(--muted);margin-top:3px}.meal-cal{font-weight:750;white-space:nowrap}.textbtn{border:0;background:none;color:var(--accent);padding:7px;font-weight:700}.empty{padding:24px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.hidden{display:none!important}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}.comparegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.compare{border:1px solid var(--line);border-radius:13px;padding:12px}.compare .name{font-size:12px;color:var(--muted)}.compare .diff{font-size:19px;font-weight:750;margin-top:4px}.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}.chart-wrap{height:230px;width:100%;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-label{font-size:10px;fill:var(--muted)}.chart-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.week-nav button{padding:8px 12px}.bottomnav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;backdrop-filter:blur(18px)}.bottomnav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650}.bottomnav button .navicon{font-size:20px;line-height:1.1}.bottomnav button.active{background:var(--accent-soft);color:var(--accent)}.notice{padding:11px 13px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:12px;margin-top:12px}.footnote{color:var(--muted);font-size:11px;margin:18px 4px}.toast{position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:90%;text-align:center}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(600px,100%);max-height:92dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:18px}.modal h3{margin:0 0 15px;font-size:20px}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.modal-top h3{margin:0}.inline-note{font-size:12px;color:var(--muted);margin-top:5px}

.dashboard-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 4px 18px}.dashboard-hero h2{font-size:29px;letter-spacing:-1px;margin:5px 0 2px}.dashboard-hero p{margin:0;color:var(--muted);font-size:13px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--accent)}.dashboard-hero .datecontrol input{max-width:145px;font-size:12px;padding:9px}.calorie-hero{background:linear-gradient(135deg,#1f3438,#1f2937 70%);border:1px solid #34504d;border-radius:22px;padding:20px;margin-bottom:13px;box-shadow:var(--shadow)}.calorie-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.calorie-number{font-size:34px;font-weight:850;letter-spacing:-1.2px;margin-top:5px}.calorie-number span{font-size:13px;color:#a7b7bc;font-weight:600;letter-spacing:0}.flame-icon{width:44px;height:44px;border-radius:15px;background:#344b43;color:#6ee7b7;display:grid;place-items:center;font-size:26px}.hero-track{height:9px;border-radius:99px;background:#3b4b4d;overflow:hidden;margin-top:19px}.hero-track>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#6ee7b7)}.hero-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:#a7b7bc}.hero-foot strong{color:#6ee7b7}.dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0;box-shadow:var(--shadow)}.metric-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;font-size:20px;font-weight:800;margin-bottom:12px}.protein-icon{background:#453a25;color:#fbbf24}.weight-icon{background:#263a52;color:#93c5fd}.steps-icon{background:#3b3154;color:#c4b5fd}.burn-icon{background:#4a3034;color:#fca5a5}.metric-value{font-size:27px;font-weight:800;letter-spacing:-.7px;margin:3px 0 5px;overflow-wrap:anywhere}.metric-value span{font-size:13px;color:var(--muted);font-weight:600}.macro-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.macro-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}.macro-head{display:flex;flex-direction:column;gap:3px}.macro-head span{font-size:12px;color:var(--muted)}.macro-head strong{font-size:20px}.dashboard-meals .meal-list{gap:8px}.dashboard-meals .meal{border-radius:15px}.dashboard-chart{padding:12px}.privacy-note{font-size:11px;color:var(--muted);text-align:center;margin:20px 4px 4px}.dashboard-meals .empty{padding:25px 14px}.dashboard-meals .empty p{margin:5px 0 14px}.dashboard-hero .datecontrol{max-width:150px}
@media(min-width:650px){.dashboard-metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.dashboard-hero h2{font-size:34px}.calorie-hero{padding:24px}.macro-grid{gap:12px}main{padding:0 22px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.comparegrid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal-backdrop{align-items:center}.topbar{padding-left:26px;padding-right:26px}.app{padding-bottom:100px}.bottomnav{left:50%;right:auto;transform:translateX(-50%);width:min(620px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
@media(max-width:380px){.dashboard-hero{align-items:flex-start;flex-direction:column}.dashboard-hero .datecontrol{max-width:100%;width:100%}.dashboard-hero .datecontrol input{max-width:none}.calorie-number{font-size:30px}.metric-card{padding:11px}.macro-card{padding:9px}.macro-head strong{font-size:17px}.stat .value{font-size:21px}.pagehead h2{font-size:21px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.datecontrol input{max-width:130px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand"><div class="logo">✓</div><div><h1>FitTrack</h1><p>Your personal fitness log</p></div></div>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
</header>
<main id="main"></main>
<nav class="bottomnav" aria-label="Main navigation">
  <button data-tab="today" class="active"><span class="navicon">⌂</span>Home</button>
  <button data-tab="meals"><span class="navicon">＋</span>Food</button>
  <button data-tab="weight"><span class="navicon">⚖</span>Weight</button>
  <button data-tab="weekly"><span class="navicon">▥</span>Progress</button>
  <button data-tab="settings"><span class="navicon">⚙</span>Settings</button>
</nav>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(() => {
'use strict';
const KEY='fittrack-data-v1', THEME='fittrack-theme-v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateObj=s=>new Date(s+'T12:00:00');
const fmtDate=(s,opts={month:'short',day:'numeric'})=>s?dateObj(s).toLocaleDateString(undefined,opts):'—';
const num=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0}):'0';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
const defaultData=()=>({settings:{goal:1900,startWeight:null},meals:[],weights:[],activities:[]});
let data=loadData(), currentTab='today', selectedDate=todayISO(), weekOffset=0, editingMealId=null;
function loadData(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.meals)&&Array.isArray(x.weights)&&Array.isArray(x.activities))return {...defaultData(),...x,settings:{...defaultData().settings,...x.settings}}}catch(e){}return defaultData()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',2400)}
function mealsOn(date){return data.meals.filter(x=>x.date===date)}
function weightOn(date){return data.weights.find(x=>x.date===date)}
function activityOn(date){return data.activities.find(x=>x.date===date)||{date,burned:0,notes:'',steps:''}}
function sumMeals(date){return mealsOn(date).reduce((a,m)=>a+Number(m.calories||0),0)}
function sumMacro(date,k){return mealsOn(date).reduce((a,m)=>a+Number(m[k]||0),0)}
function dayRange(date){const d=dateObj(date);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`})}
function diffLabel(delta){if(delta===null||!Number.isFinite(delta))return {text:'No data',cls:'flat'};if(Math.abs(delta)<0.005)return {text:'0.00 kg',cls:'flat'};return {text:`${delta>0?'+':''}${delta.toFixed(2)} kg`,cls:delta>0?'up':'down'}}
function compareWeight(date,offsetDays){const cur=weightOn(date);if(!cur)return null;const target=new Date(dateObj(date));target.setDate(target.getDate()-offsetDays);const key=`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;const prev=weightOn(key);return prev?Number(cur.kg)-Number(prev.kg):null}
function startWeight(){if(data.settings.startWeight!==null&&data.settings.startWeight!==''&&Number.isFinite(Number(data.settings.startWeight)))return Number(data.settings.startWeight);const first=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date))[0];return first?Number(first.kg):null}
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function section(title,right=''){return `<div class="section-title"><h3>${title}</h3>${right}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function mealRows(date){const ms=mealsOn(date).slice().sort((a,b)=>a.created-b.created);if(!ms.length)return empty('No meals logged for this day yet.');return `<div class="meal-list">${ms.map(m=>`<div class="meal"><div class="meal-icon">${({Breakfast:'☀️',Lunch:'🥗',Dinner:'🍽️',Snack:'🍎'}[m.type]||'🍴')}</div><div class="meal-main"><strong>${esc(m.name)}</strong><div class="meta">${esc(m.type)} · P ${num(m.protein)}g · C ${num(m.carbs)}g · F ${num(m.fat)}g</div></div><div class="meal-cal">${num(m.calories)}<div class="small muted">kcal</div></div><button class="textbtn" data-edit-meal="${m.id}" aria-label="Edit ${esc(m.name)}">Edit</button><button class="textbtn" data-delete-meal="${m.id}" aria-label="Delete ${esc(m.name)}">×</button></div>`).join('')}</div>`}
function renderToday(){const eaten=sumMeals(selectedDate),act=activityOn(selectedDate),burn=Number(act.burned||0),goal=Number(data.settings.goal||1900),w=weightOn(selectedDate),protein=sumMacro(selectedDate,'protein'),carbs=sumMacro(selectedDate,'carbs'),fat=sumMacro(selectedDate,'fat'),steps=Number(act.steps||0),pct=goal>0?Math.min(100,Math.round(eaten/goal*100)):0,proteinGoal=Number(data.settings.proteinGoal||130),stepGoal=Number(data.settings.stepGoal||10000),weightDiff=compareWeight(selectedDate,7),recent=dayRange(selectedDate);
const macroCard=(label,value,target,color)=>`<div class="macro-card"><div class="macro-head"><span>${label}</span><strong>${num(value)} g</strong></div><div class="progress"><div style="width:${target>0?Math.min(100,value/target*100):0}%;background:${color}"></div></div><div class="small muted">${target?`${num(target)} g goal`:'Logged total'}</div></div>`;
return `<div class="dashboard-hero"><div><div class="eyebrow">FITTRACK · DAILY OVERVIEW</div><h2>Today, let's go.</h2><p>${fmtDate(selectedDate,{weekday:'long',month:'long',day:'numeric'})}</p></div><div class="datecontrol"><input id="selectedDate" type="date" value="${selectedDate}" aria-label="Selected date"></div></div>
<div class="calorie-hero"><div class="calorie-top"><div><div class="muted small">CALORIES CONSUMED</div><div class="calorie-number">${num(eaten)} <span>/ ${num(goal)} kcal</span></div></div><div class="flame-icon">ϟ</div></div><div class="hero-track"><div style="width:${pct}%"></div></div><div class="hero-foot"><span>${pct}% of daily goal</span><strong>${num(Math.max(0,goal-eaten))} kcal remaining</strong></div></div>
<div class="grid dashboard-metrics"><div class="metric-card"><div class="metric-icon protein-icon">◉</div><div class="muted small">Protein</div><div class="metric-value">${num(protein)}<span> g</span></div><div class="progress"><div style="width:${Math.min(100,protein/proteinGoal*100)}%;background:#fbbf24"></div></div><div class="small muted">of ${num(proteinGoal)} g goal</div></div><div class="metric-card"><div class="metric-icon weight-icon">↗</div><div class="muted small">Body weight</div><div class="metric-value">${w?num(w.kg,2):'—'}<span>${w?' kg':''}</span></div><div class="small ${weightDiff===null?'muted':diffLabel(weightDiff).cls}">${w?`7-day change ${diffLabel(weightDiff).text}`:'Log a weigh-in'}</div><button class="textbtn" data-action="edit-weight">${w?'Update weight':'＋ Log weight'}</button></div><div class="metric-card"><div class="metric-icon steps-icon">⌁</div><div class="muted small">Steps</div><div class="metric-value">${steps?num(steps):'—'}</div><div class="progress"><div style="width:${Math.min(100,steps/stepGoal*100)}%;background:#c4b5fd"></div></div><div class="small muted">${steps?`${num(Math.max(0,stepGoal-steps))} to goal`:'Log steps in activity'}</div></div><div class="metric-card"><div class="metric-icon burn-icon">ϟ</div><div class="muted small">Activity burned</div><div class="metric-value">${num(burn)}<span> kcal</span></div><div class="small muted">Manually logged activity</div><button class="textbtn" data-action="edit-activity">＋ Update activity</button></div></div>
<div class="section-title"><h3>Macros</h3><span class="small muted">Today's logged totals</span></div><div class="grid macro-grid">${macroCard('Protein',protein,proteinGoal,'#fbbf24')}${macroCard('Carbs',carbs,0,'#60a5fa')}${macroCard('Fat',fat,0,'#f472b6')}</div>
<div class="section-title"><h3>Today's meals</h3><button class="btn secondary" data-action="add-meal">＋ Add food</button></div><div class="dashboard-meals">${mealsOn(selectedDate).length?mealRows(selectedDate):`<div class="empty"><div style="font-size:28px;margin-bottom:8px">＋</div><strong>No meals logged yet</strong><p class="small">Add your first meal to see calories and macros here.</p><button class="btn" data-action="add-meal">Add a meal</button></div>`}</div>
<div class="section-title"><h3>Weight trend</h3><button class="textbtn" data-tab="weekly">View progress →</button></div><div class="card dashboard-chart">${svgChart(recent)}<div class="inline-note">Use consistent weigh-in conditions and focus on the trend rather than one day's change.</div></div><div class="privacy-note">Your entries stay in this browser on this device. Activity calories are manually entered estimates.</div>`}
function renderSettings(){const goal=Number(data.settings.goal||1900);return `<div class="pagehead"><h2>Settings</h2><span class="pill">Stored on this device</span></div><div class="card"><h3 style="margin-top:0">Daily goals</h3><div class="formgrid"><div><label class="field-label" for="goalInput">Calorie goal (kcal)</label><input id="goalInput" type="number" min="0" max="10000" value="${esc(goal)}"></div><div><label class="field-label" for="proteinGoalInput">Protein goal (g)</label><input id="proteinGoalInput" type="number" min="0" max="500" value="${esc(data.settings.proteinGoal??130)}"></div><div><label class="field-label" for="stepGoalInput">Step goal</label><input id="stepGoalInput" type="number" min="0" max="100000" value="${esc(data.settings.stepGoal??10000)}"></div><div><label class="field-label" for="startWeightInput">Starting weight (kg)</label><input id="startWeightInput" type="number" min="0" max="500" step=".01" placeholder="Use first logged weight" value="${data.settings.startWeight??''}"></div></div><div class="btnrow" style="margin-top:14px"><button class="btn" data-action="save-settings">Save goals</button></div></div><div class="section-title"><h3>Appearance</h3></div><div class="card"><div class="record"><div class="meal-icon">◐</div><div style="flex:1"><strong>Theme</strong><div class="small muted">Modern dark premium appearance</div></div><button class="btn ghost" id="themeBtnInline">Switch theme</button></div></div><div class="section-title"><h3>Data & backup</h3></div><div class="card"><p class="muted small">Export your records before clearing browser data or moving devices. Importing replaces the records currently stored here.</p><div class="btnrow"><button class="btn" data-action="export-json">Export JSON</button><button class="btn ghost" data-action="export-csv">Export CSV</button><button class="btn ghost" data-action="import">Import backup</button></div></div><div class="section-title"><h3>Food database</h3></div><div class="card"><strong>${FOOD_DB.length} foods available</strong><p class="small muted">Label-derived values are used where provided. Generic and recipe-dependent foods are estimates and may vary by preparation.</p></div><div class="footnote">FitTrack stores data locally in your browser. It does not automatically sync between devices.</div>`}
function renderMeals(){return `<div class="pagehead"><h2>Meals</h2><button class="btn" data-action="add-meal">＋ Add meal</button></div><div class="card"><label class="field-label" for="mealDate">Show meals for</label><input id="mealDate" type="date" value="${selectedDate}"><div class="inline-note">Edit or delete any entry. Macronutrients are optional; enter values from labels or your own estimates.</div></div>${section(`Meals on ${fmtDate(selectedDate,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}`,`<span class="pill">${num(sumMeals(selectedDate))} kcal</span>`)}${mealRows(selectedDate)}${section('Daily macros')}<div class="grid stats">${stat('Protein',`${num(sumMacro(selectedDate,'protein'))} g`,'Logged total')}${stat('Carbs',`${num(sumMacro(selectedDate,'carbs'))} g`,'Logged total')}${stat('Fat',`${num(sumMacro(selectedDate,'fat'))} g`,'Logged total')}${stat('Meal entries',`${mealsOn(selectedDate).length}`,'For selected date')}</div>`}
function renderWeight(){const w=weightOn(selectedDate),todayW=weightOn(todayISO()),sw=startWeight();const comp=[['Yesterday',compareWeight(selectedDate,1)],['7 days ago',compareWeight(selectedDate,7)],['Starting weight',w&&sw!==null?Number(w.kg)-sw:null]];const history=data.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
return `<div class="pagehead"><h2>Weight</h2><div class="datecontrol"><input id="weightDate" type="date" value="${selectedDate}"></div></div><div class="card"><div class="formgrid"><div class="full"><label class="field-label" for="weightValue">Weight (kg)</label><input id="weightValue" type="number" min="20" max="500" step=".01" placeholder="e.g. 80.10" value="${w?esc(w.kg):''}"></div></div><div class="btnrow" style="margin-top:12px"><button class="btn" data-action="save-weight">Save weight</button>${w?'<button class="btn ghost" data-action="delete-weight">Delete entry</button>':''}</div><div class="inline-note">One weight entry is allowed per date. Weighing under similar conditions helps make trends more useful.</div></div>

function svgChart(days){const vals=days.map(d=>({date:d,w:weightOn(d)?.kg})).filter(x=>x.w!==undefined);if(!vals.length)return empty('Log your weight on a few days to see a trend chart.');const W=600,H=220,L=42,R=16,T=16,B=34,plotW=W-L-R,plotH=H-T-B;const all=vals.map(x=>Number(x.w)),min=Math.min(...all),max=Math.max(...all),pad=Math.max((max-min)*.2,.25),lo=min-pad,hi=max+pad;const x=i=>L+(vals.length===1?plotW/2:i*plotW/(vals.length-1)),y=v=>T+(hi-v)/(hi-lo)*plotH;let path=vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(Number(v.w))}`).join(' ');let ticks=[lo,(lo+hi)/2,hi];return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${L-7}" y="${y(t)+4}" text-anchor="end" class="chart-label">${t.toFixed(1)}</text>`).join('')}<path d="${path}" class="chart-line"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(Number(v.w))}" r="4.5" class="chart-dot"><title>${v.date}: ${Number(v.w).toFixed(2)} kg</title></circle>`).join('')}${vals.map((v,i)=>i===0||i===vals.length-1||vals.length<=7?`<text x="${x(i)}" y="${H-9}" text-anchor="middle" class="chart-label">${fmtDate(v.date)}</text>`:'').join('')}</svg></div>`}
function renderWeekly(){const days=dayRangeOffset(selectedDate,weekOffset),from=days[0],to=days[6],ws=days.map(d=>weightOn(d)).filter(Boolean),mealDays=days.reduce((a,d)=>a+sumMeals(d),0),burnDays=days.reduce((a,d)=>a+Number(activityOn(d).burned||0),0),avgE=days.reduce((a,d)=>a+sumMeals(d),0)/7,avgW=ws.length?ws.reduce((a,x)=>a+Number(x.kg),0)/ws.length:null,logged=days.filter(d=>mealsOn(d).length).length;return `<div class="pagehead"><h2>Weekly progress</h2><span class="pill">${ws.length} weigh-ins</span></div><div class="week-nav"><button class="btn ghost" data-action="prev-week">← Previous</button><strong>${fmtDate(from)} – ${fmtDate(to,{month:'short',day:'numeric',year:from.slice(0,4)===to.slice(0,4)?undefined:'numeric'})}</strong><button class="btn ghost" data-action="next-week" ${weekOffset===0?'disabled':''}>Next →</button></div><div class="grid stats">${stat('Average weight',avgW===null?'—':`${num(avgW,2)} kg`,`${ws.length} logged days`)}${stat('Calories eaten',`${num(mealDays)} kcal`,'Total for 7 days')}${stat('Calories burned',`${num(burnDays)} kcal`,'Total logged activity')}${stat('Daily intake avg',`${num(avgE)} kcal`,'Includes days with no meals as zero')}</div>${section('Weight trend')}<div class="card">${svgChart(days)}<div class="inline-note">Only dates with recorded weight appear in the chart. Short-term changes can reflect water, food and normal fluctuation.</div></div>${section('Daily breakdown')}<div class="record-list">${days.map(d=>{const ww=weightOn(d),e=sumMeals(d),a=activityOn(d);return `<div class="record"><div class="meal-icon">${d===todayISO()?'📍':'📅'}</div><div style="flex:1;min-width:0"><strong>${fmtDate(d,{weekday:'short',month:'short',day:'numeric'})}</strong><div class="small muted">${num(e)} kcal eaten · ${num(a.burned||0)} burned</div></div><div style="text-align:right"><strong>${ww?num(ww.kg,2)+' kg':'—'}</strong><button class="textbtn" data-open-date="${d}">Open</button></div></div>`}).join('')}</div><div class="notice">${logged} of 7 days have meal entries. Empty days are counted as zero in the weekly calorie totals and average; log meals consistently for a more representative summary.</div>`}
function dayRangeOffset(date,offset){const base=dayRange(date);if(!offset)return base;return base.map(d=>{const x=dateObj(d);x.setDate(x.getDate()+offset*7);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`})}
function render(){const main=document.getElementById('main');main.innerHTML=currentTab==='today'?renderToday():currentTab==='meals'?renderMeals():currentTab==='weight'?renderWeight():currentTab==='settings'?renderSettings():renderWeekly();document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));const inline=document.getElementById('themeBtnInline');if(inline)inline.onclick=()=>document.getElementById('themeBtn').click();}
function openModal(title,body,onSubmit){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><h3>${esc(title)}</h3><button class="iconbtn" type="button" id="closeModal" aria-label="Close">✕</button></div>${body}</div></div>`;const close=()=>root.innerHTML='';document.getElementById('closeModal').onclick=close;document.getElementById('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')close()});const form=root.querySelector('form');if(form)form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form);try{const result=await onSubmit(Object.fromEntries(fd.entries()));if(result!==false){close();render()}}catch(err){toast('Something went wrong. Please try again.')}})}

function mealForm(id=null){

 const foodsHtml=FOOD_DB.map((f,i)=>`<option value="${i}">${esc(f.name)} — ${esc(f.basis)} (${esc(f.status)})</option>`).join("");
 openModal(m?'Edit meal':'Build a meal',`<form id="mealForm">

 const root=document.getElementById('modalRoot');
 const search=root.querySelector('#foodSearch'), select=root.querySelector('#foodSelect'), grams=root.querySelector('#foodGrams');
 function renderIngredients(){
  const keys=["calories","protein","carbs","fat"];
  const totals=ingredients.reduce((a,x)=>{keys.forEach(k=>{if(x[k]!=null)a[k]+=Number(x[k]||0)});return a;},{calories:0,protein:0,carbs:0,fat:0});
  const incomplete=ingredients.filter(x=>keys.some(k=>x[k]==null));
  root.querySelector('#ingredientList').innerHTML=ingredients.length?ingredients.map((x,i)=>`<div class="meal" style="margin-bottom:7px"><div class="meal-main"><strong>${esc(x.name)}</strong><div class="meta">${num(x.grams,1)} ${esc(x.unit||"g")} · ${x.calories==null?"kcal missing":num(x.calories)} kcal · P ${x.protein==null?"—":num(x.protein,1)+"g"} · C ${x.carbs==null?"—":num(x.carbs,1)+"g"} · F ${x.fat==null?"—":num(x.fat,1)+"g"}</div><div class="meta">${esc(x.basis||"")} · ${esc(x.status||"")}</div>${x.notes?`<div class="meta">${esc(x.notes)}</div>`:""}</div><button class="textbtn" type="button" data-remove-ingredient="${i}">Remove</button></div>`).join(""):empty('No ingredients added yet.');
  root.querySelector('#totalKcal').textContent=incomplete.some(x=>x.calories==null)?"Incomplete":num(Math.round(totals.calories));
  root.querySelector('#totalProtein').textContent=incomplete.some(x=>x.protein==null)?"Incomplete":num(totals.protein,1);
  root.querySelector('#totalCarbs').textContent=incomplete.some(x=>x.carbs==null)?"Incomplete":num(totals.carbs,1);
  root.querySelector('#totalFat').textContent=incomplete.some(x=>x.fat==null)?"Incomplete":num(totals.fat,1);
  root.querySelectorAll('.nutrition-warning').forEach(el=>el.remove());
  if(incomplete.length){
    const note=document.createElement('div');note.className='notice nutrition-warning';
    note.textContent='Nutrition incomplete for: '+incomplete.map(x=>x.name).join(', ')+'. Fill in the missing values from the product label before saving this meal.';
    root.querySelector('#ingredientList').appendChild(note);
  }
  ['Calories','Protein','Carbs','Fat'].forEach((label,i)=>{const id=['manualCalories','manualProtein','manualCarbs','manualFat'][i];const el=root.querySelector('#'+id);if(el)el.value=incomplete.length?'':(i===0?Math.round(totals.calories):totals[['protein','carbs','fat'][i-1]].toFixed(1))});
 }

  select.innerHTML=filtered.map(x=>`<option value="${x.i}">${esc(x.f.name)} — ${esc(x.f.basis)} (${esc(x.f.status)})</option>`).join("");
  if(!filtered.length)select.innerHTML='<option value="">No matching foods</option>';
 }
 search.addEventListener('input',refreshFoodOptions);
 root.querySelector('#addIngredient').onclick=()=>{
  const idx=Number(select.value), amount=Number(grams.value);
  if(!Number.isInteger(idx)||!FOOD_DB[idx]||!Number.isFinite(amount)||amount<=0){toast('Choose a food and enter grams greater than zero.');return}

  ingredients.push({foodIndex:idx,name:f.name,grams:amount,unit:f.basis.toLowerCase().includes("ml")?"ml":"g",
    basis:f.basis,status:f.status,notes:f.notes,
    calories:f.kcal==null?null:f.kcal*factor,
    protein:f.p==null?null:f.p*factor,carbs:f.c==null?null:f.c*factor,
    fat:f.f==null?null:f.f*factor,fiber:f.fiber==null?null:f.fiber*factor});
  if(!root.querySelector('#mealName').value)root.querySelector('#mealName').value=f.name;
  renderIngredients();
 };
 root.querySelector('#ingredientList').addEventListener('click',e=>{

 });
 root.querySelector('#cancelMeal').onclick=()=>root.innerHTML='';

}
function activityForm(){const a=activityOn(selectedDate);openModal('Daily activity',`<form><div class="formgrid"><div><label class="field-label">Calories burned (kcal)</label><input name="burned" type="number" min="0" max="50000" step="1" value="${esc(a.burned||0)}"></div><div><label class="field-label">Steps (optional)</label><input name="steps" type="number" min="0" max="200000" step="1" value="${esc(a.steps||'')}"></div><div class="full"><label class="field-label">Activity notes</label><textarea name="notes" rows="3" maxlength="500" placeholder="e.g. Chest workout, 15 min incline treadmill">${esc(a.notes||'')}</textarea></div></div><div class="actions"><button class="btn ghost" type="button" id="cancelActivity">Cancel</button><button class="btn">Save activity</button></div></form>`,v=>{data.activities=data.activities.filter(x=>x.date!==selectedDate);data.activities.push({date:selectedDate,burned:Number(v.burned||0),steps:v.steps===''?'':Number(v.steps),notes:v.notes.trim()});save();toast('Activity saved')});document.getElementById('cancelActivity').onclick=()=>document.getElementById('modalRoot').innerHTML=''}
function saveWeight(){const input=document.getElementById('weightValue');if(!input)return;const v=input.value;if(v===''||!Number.isFinite(Number(v))||Number(v)<20||Number(v)>500){toast('Enter a valid weight in kg.');return}data.weights=data.weights.filter(x=>x.date!==selectedDate);data.weights.push({date:selectedDate,kg:Number(Number(v).toFixed(2))});data.weights.sort((a,b)=>a.date.localeCompare(b.date));if(data.settings.startWeight===null||data.settings.startWeight==='')data.settings.startWeight=Number(Number(v).toFixed(2));save();toast('Weight saved');render()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(`fittrack-backup-${todayISO()}.json`,JSON.stringify({...data,exportedAt:new Date().toISOString(),formatVersion:1},null,2),'application/json');toast('JSON backup exported')}
function csvCell(v){const s=String(v??'');return `"${s.replace(/"/g,'""')}"`}
function exportCSV(){const rows=[['date','record_type','name','meal_type','calories_kcal','protein_g','carbs_g','fat_g','weight_kg','calories_burned_kcal','steps','notes']];data.meals.forEach(m=>rows.push([m.date,'meal',m.name,m.type,m.calories,m.protein,m.carbs,m.fat,'','','','']));data.weights.forEach(w=>rows.push([w.date,'weight','','','','','','',w.kg,'','','']));data.activities.forEach(a=>rows.push([a.date,'activity','','','','','','','',a.burned,a.steps,a.notes]));download(`fittrack-export-${todayISO()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported')}
function importBackup(){openModal('Import JSON backup',`<form><div class="notice">Import replaces the records currently stored in this browser. Export a backup first if you want to keep them.</div><label class="field-label" style="margin-top:14px">Choose a FitTrack JSON backup</label><input name="file" type="file" accept="application/json,.json" required><div class="actions"><button class="btn ghost" type="button" id="cancelImport">Cancel</button><button class="btn">Import backup</button></div></form>`,async v=>{const file=v.file;if(!file||typeof file==='string')return false;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.meals)||!Array.isArray(parsed.weights)||!Array.isArray(parsed.activities))throw Error('invalid');data={...defaultData(),...parsed,settings:{...defaultData().settings,...parsed.settings}};save();selectedDate=todayISO();toast('Backup imported')}catch(e){toast('Could not read this FitTrack backup.');return false}});document.getElementById('cancelImport').onclick=()=>document.getElementById('modalRoot').innerHTML=''}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){currentTab=b.dataset.tab;render();return}if(b.dataset.action){const a=b.dataset.action;if(a==='add-meal')mealForm();if(a==='edit-activity')activityForm();if(a==='edit-weight'){currentTab='weight';render()}if(a==='save-weight')saveWeight();if(a==='delete-weight'){if(confirm(`Delete weight for ${selectedDate}?`)){data.weights=data.weights.filter(x=>x.date!==selectedDate);save();render();toast('Weight deleted')}}if(a==='save-settings'){const g=Number(document.getElementById('goalInput').value),s=document.getElementById('startWeightInput').value;if(!Number.isFinite(g)||g<0||g>10000){toast('Enter a valid calorie goal.');return}if(s!==''&&(!Number.isFinite(Number(s))||Number(s)<20||Number(s)>500)){toast('Enter a valid starting weight.');return}const pg=Number(document.getElementById('proteinGoalInput')?.value??data.settings.proteinGoal??130),sg=Number(document.getElementById('stepGoalInput')?.value??data.settings.stepGoal??10000);if(!Number.isFinite(pg)||pg<0||pg>500||!Number.isFinite(sg)||sg<0||sg>100000){toast('Enter valid protein and step goals.');return}data.settings.goal=g;data.settings.proteinGoal=pg;data.settings.stepGoal=sg;data.settings.startWeight=s===''?null:Number(s);save();render();toast('Settings saved')}if(a==='export-json')exportJSON();if(a==='export-csv')exportCSV();if(a==='import')importBackup();if(a==='prev-week'){weekOffset--;render()}if(a==='next-week'){weekOffset=Math.min(0,weekOffset+1);render()}return}
if(b.dataset.editMeal)mealForm(b.dataset.editMeal);
if(b.dataset.deleteMeal){const m=data.meals.find(x=>x.id===b.dataset.deleteMeal);if(m&&confirm(`Delete "${m.name}"?`)){data.meals=data.meals.filter(x=>x.id!==m.id);save();render();toast('Meal deleted')}}
if(b.dataset.openDate){selectedDate=b.dataset.openDate;currentTab='today';render()}
});
document.addEventListener('change',e=>{if(e.target.id==='selectedDate'||e.target.id==='mealDate'||e.target.id==='weightDate'){if(e.target.value){selectedDate=e.target.value;render()}}});
document.getElementById('themeBtn').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(THEME,next);document.getElementById('themeBtn').textContent=next==='dark'?'☀':'☾'});
const savedTheme=localStorage.getItem(THEME);if(savedTheme)document.documentElement.dataset.theme=savedTheme;document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body>
</html>
